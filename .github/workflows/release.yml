name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package.json version '$version' (expected '$expected')."
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust (MSVC x64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install pinned cargo-about
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run release:check
          npm run test:dev-config
          npm run test:hall-travel
          npm run test:button-labels
          npm run test:hardware-labels

      - name: Build release ZIP
        id: build
        shell: pwsh
        run: ./build-tauri-distribution.ps1

      - name: Check repository visibility
        id: visibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $visibility = gh api "repos/$env:REPO" --jq .visibility
          if ($visibility -eq 'public') {
            "public=true" >> $env:GITHUB_OUTPUT
          } else {
            "public=false" >> $env:GITHUB_OUTPUT
            "::notice::Skipping build provenance: attestations are not available for this repository."
          }

      - name: Generate build provenance for ZIP
        if: steps.visibility.outputs.public == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.archive_path }}

      - name: Generate build provenance for executable
        if: steps.visibility.outputs.public == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.executable_path }}

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: |
            ${{ steps.build.outputs.archive_path }}
            ${{ steps.build.outputs.checksum_path }}
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.build.outputs.archive_path }}
          CHECKSUM: ${{ steps.build.outputs.checksum_path }}
        run: |
          gh release create $env:TAG $env:ARCHIVE $env:CHECKSUM `
            --draft `
            --verify-tag `
            --title "RapidJAM Configurator $env:TAG" `
            --notes-file "docs/release-notes/$env:TAG.md" `
            --generate-notes
