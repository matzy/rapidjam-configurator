[package]
name = "rapidjam-configurator"
version = "0.7.1"
description = "RapidJAM controller configurator"
authors = ["RapidJAM"]
edition = "2021"
publish = false

[lib]
name = "rapidjam_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
